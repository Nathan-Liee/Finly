<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6B7EFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finly" />
  <title>Finly — Catatan Keuangan UMKM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/app-icon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #FAFBFC;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeIn 0.4s ease-out;
    }
    .splash-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6B7EFF 0%, #4A5AE7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-icon svg {
      width: 52px;
      height: 52px;
    }
    .splash-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
    }
    .splash-sub {
      font-size: 0.875rem;
      color: #6B7280;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid #E5E7EB;
      border-top: 3px solid #6B7EFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <path d="M18 40 L26 30 L31 36 L44 20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M39 20 L44 20 L44 25" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="31" cy="35" r="18" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" fill="none"/>
      </svg>
    </div>
    <div class="splash-title">Finly</div>
    <div class="splash-sub">Catatan Keuangan UMKM</div>
    <div class="loader"></div>
  </div>
</body>
</html>
