<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7EFF"/>
      <stop offset="100%" stop-color="#4A5AE7"/>
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="56" y="56" width="400" height="400" rx="88" fill="url(#brandGradient)"/>
  <!-- Upward chart arrow -->
  <path d="M156 330 L230 250 L270 290 L356 190" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M310 190 L356 190 L356 236" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Coin ring -->
  <circle cx="256" cy="280" r="56" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="10"/>
  <!-- Small decorative dot (tracking pin) -->
  <circle cx="256" cy="280" r="8" fill="#FFFFFF"/>
</svg>
